name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFORGE_TEST_DATABASE_URL: postgres://goforge:goforge@localhost:5432/goforge?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: goforge
          POSTGRES_USER: goforge
          POSTGRES_PASSWORD: goforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goforge -d goforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/forge" ./cmd/forge
      - name: Public v0.7.0 format-7 model compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-format7-cli"
          GOBIN="$RUNNER_TEMP/released-format7-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.7.0
          "$RUNNER_TEMP/released-format7-cli/forge" new "$RUNNER_TEMP/released-format7-app" --module example.com/releasedformat7
          cd "$RUNNER_TEMP/released-format7-app"
          # v0.7.0 did not write its direct module checksums during scaffold creation.
          # Normalize that historical baseline before proving the current generator
          # leaves the released application's dependency graph tidy and unchanged.
          go mod tidy
          "$RUNNER_TEMP/forge" make:model Customer --field name:string
          "$RUNNER_TEMP/forge" make:model Invoice --field number:string --field notes:text:nullable --belongs-to customer:Customer
          test "$("$RUNNER_TEMP/released-format7-cli/forge" version)" = 'forge 0.7.0'
          grep -q '^version: 7$' forge.yaml
          grep -q 'github.com/ShanilKoshitha/goforge v0.7.0' go.mod
          test -z "$(grep '^replace ' go.mod || true)"
          "$RUNNER_TEMP/forge" orm:generate --check
          go mod verify
          go mod tidy -diff
          go test ./...
          go vet ./...
          go build ./cmd/server
      - name: Released format-8 compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-cli"
          GOBIN="$RUNNER_TEMP/released-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.11.0
          "$RUNNER_TEMP/released-cli/forge" new "$RUNNER_TEMP/released-app" --module example.com/releasedapp
          cd "$RUNNER_TEMP/released-app"
          "$RUNNER_TEMP/forge" make:resource SubsequentIssue --field title:string
          test ! -e internal/resources/subsequentissue/authorization.go
          cp internal/models/zz_orm_gen.go "$RUNNER_TEMP/orm-before.go"
          "$RUNNER_TEMP/forge" test
          "$RUNNER_TEMP/forge" build
          go mod verify
          cmp "$RUNNER_TEMP/orm-before.go" internal/models/zz_orm_gen.go
          test -x bin/app
          grep -q '^version: 8$' forge.yaml
          test -z "$(grep '^replace ' go.mod || true)"
          cp go.mod "$RUNNER_TEMP/released-go.mod"
          cp go.sum "$RUNNER_TEMP/released-go.sum"
          cp forge.yaml "$RUNNER_TEMP/released-forge.yaml"
          APP_ENV=local APP_ADDRESS=127.0.0.1:18081 "$RUNNER_TEMP/forge" serve >"$RUNNER_TEMP/released-serve.log" 2>&1 &
          serve_pid=$!
          cleanup() {
            kill -TERM "$serve_pid" 2>/dev/null || true
            wait "$serve_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 150); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18081/health >/dev/null; then break; fi
            if ! kill -0 "$serve_pid" 2>/dev/null; then cat "$RUNNER_TEMP/released-serve.log"; exit 1; fi
            sleep 0.1
          done
          curl --fail --silent --max-time 1 http://127.0.0.1:18081/health >/dev/null
          printf '\n<p>released-format-live-reload</p>\n' >> resources/views/partials/tagline.forge.html
          for attempt in $(seq 1 300); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18081/ | grep -q 'released-format-live-reload'; then break; fi
            if ! kill -0 "$serve_pid" 2>/dev/null; then cat "$RUNNER_TEMP/released-serve.log"; exit 1; fi
            sleep 0.1
          done
          curl --fail --silent --max-time 1 http://127.0.0.1:18081/ | grep -q 'released-format-live-reload'
          kill -TERM "$serve_pid"
          wait "$serve_pid"
          trap - EXIT
          cmp "$RUNNER_TEMP/released-go.mod" go.mod
          cmp "$RUNNER_TEMP/released-go.sum" go.sum
          cmp "$RUNNER_TEMP/released-forge.yaml" forge.yaml
      - name: Public v0.12.1 format-9 upgrade compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-format9-cli"
          GOBIN="$RUNNER_TEMP/released-format9-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.12.1
          "$RUNNER_TEMP/released-format9-cli/forge" new "$RUNNER_TEMP/released-format9-app" --module example.com/releasedformat9
          cd "$RUNNER_TEMP/released-format9-app"
          "$RUNNER_TEMP/forge" make:resource SubsequentIssue --field title:string
          test ! -e internal/resources/subsequentissue/authorization.go
          test "$("$RUNNER_TEMP/released-format9-cli/forge" version)" = 'forge 0.12.1'
          grep -q '^version: 9$' forge.yaml
          grep -q 'github.com/ShanilKoshitha/goforge v0.12.0' go.mod
          test -z "$(grep '^replace ' go.mod || true)"
          go mod verify
          go mod tidy -diff
          "$RUNNER_TEMP/forge" test
          go vet ./...
          "$RUNNER_TEMP/forge" build
      - name: Public v0.13.1 format-10 relationship upgrade compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-format10-cli"
          GOBIN="$RUNNER_TEMP/released-format10-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.13.1
          "$RUNNER_TEMP/released-format10-cli/forge" new "$RUNNER_TEMP/released-format10-app" --module example.com/releasedformat10
          cd "$RUNNER_TEMP/released-format10-app"
          "$RUNNER_TEMP/released-format10-cli/forge" make:resource Category --field title:string
          "$RUNNER_TEMP/forge" make:resource SubsequentIssue --field title:string --belongs-to category:Category
          test ! -e internal/resources/category/authorization.go
          test ! -e internal/resources/subsequentissue/authorization.go
          test "$("$RUNNER_TEMP/released-format10-cli/forge" version)" = 'forge 0.13.1'
          grep -q '^version: 10$' forge.yaml
          grep -q 'github.com/ShanilKoshitha/goforge v0.13.0' go.mod
          test -z "$(grep '^replace ' go.mod || true)"
          go mod verify
          go mod tidy -diff
          "$RUNNER_TEMP/forge" test
          go vet ./...
          "$RUNNER_TEMP/forge" build
      - name: Public v0.14.1 format-11 upgrade compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-format11-cli"
          GOBIN="$RUNNER_TEMP/released-format11-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.14.1
          "$RUNNER_TEMP/released-format11-cli/forge" new "$RUNNER_TEMP/released-format11-app" --module example.com/releasedformat11
          cd "$RUNNER_TEMP/released-format11-app"
          "$RUNNER_TEMP/released-format11-cli/forge" make:job RegisteredJobNamesJob
          "$RUNNER_TEMP/released-format11-cli/forge" make:job ValidateScheduledTargetsJob
          test ! -e internal/jobmanifest/manifest_gen.go
          "$RUNNER_TEMP/forge" make:job SubsequentWork
          "$RUNNER_TEMP/forge" make:resource Category --field title:string
          "$RUNNER_TEMP/forge" make:resource SubsequentIssue --field title:string --belongs-to category:Category
          test ! -e internal/resources/category/authorization.go
          test ! -e internal/resources/subsequentissue/authorization.go
          grep -q '^version: 11$' forge.yaml
          grep -q 'github.com/ShanilKoshitha/goforge v0.14.0' go.mod
          grep -q 'jobs.RegisteredJobNamesDefinition.Name()' internal/jobmanifest/manifest_gen.go
          grep -q 'jobs.ValidateScheduledTargetsDefinition.Name()' internal/jobmanifest/manifest_gen.go
          grep -q 'jobs.SubsequentWorkDefinition.Name()' internal/jobmanifest/manifest_gen.go
          go mod verify
          go mod tidy -diff
          "$RUNNER_TEMP/forge" test
          go vet ./...
          "$RUNNER_TEMP/forge" build
          go build ./cmd/worker
          go build ./cmd/scheduler
      - name: Public v0.17.1 format-12 upgrade compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/released-format12-cli"
          GOBIN="$RUNNER_TEMP/released-format12-cli" go install github.com/ShanilKoshitha/goforge/cmd/forge@v0.17.1
          "$RUNNER_TEMP/released-format12-cli/forge" new "$RUNNER_TEMP/released-format12-app" --module example.com/releasedformat12
          cd "$RUNNER_TEMP/released-format12-app"
          "$RUNNER_TEMP/released-format12-cli/forge" make:resource ExistingIssue --field title:string
          "$RUNNER_TEMP/forge" make:resource SubsequentIssue --field title:string
          "$RUNNER_TEMP/forge" make:model Customer --field name:string
          "$RUNNER_TEMP/forge" make:model Invoice --field number:string --field notes:text:nullable --belongs-to customer:Customer
          test "$("$RUNNER_TEMP/released-format12-cli/forge" version)" = 'forge 0.17.1'
          grep -q '^version: 12$' forge.yaml
          grep -q 'github.com/ShanilKoshitha/goforge v0.17.0' go.mod
          test ! -e internal/resources/existingissue/authorization.go
          test ! -e internal/resources/subsequentissue/authorization.go
          test -z "$(grep '^replace ' go.mod || true)"
          go mod verify
          go mod tidy -diff
          "$RUNNER_TEMP/forge" assets:check
          "$RUNNER_TEMP/forge" test
          go vet ./...
          "$RUNNER_TEMP/forge" build
      - name: Current checkout scaffold
        run: |
          test "$("$RUNNER_TEMP/forge" version)" = 'forge 0.19.0'
          "$RUNNER_TEMP/forge" new "$RUNNER_TEMP/current-app" --module example.com/currentapp
          cd "$RUNNER_TEMP/current-app"
          grep -q 'github.com/ShanilKoshitha/goforge v0.17.0' go.mod
          test -z "$(grep '^replace ' go.mod || true)"
          grep -Fqx 'github.com/ShanilKoshitha/goforge v0.17.0 h1:r3JWPwcB8YNNU9+22v4K3Bx6M7S8fbQ4HIB3rXRdlDY=' go.sum
          grep -Fqx 'github.com/ShanilKoshitha/goforge v0.17.0/go.mod h1:UQE0b3seoEHYB618VF1jcflF59zBrHJOEMdGEWkMpPM=' go.sum
          grep -q '^version: 13$' forge.yaml
          "$RUNNER_TEMP/forge" make:model Customer --field name:string
          "$RUNNER_TEMP/forge" make:model Invoice --field number:string --field notes:text:nullable --belongs-to customer:Customer
          "$RUNNER_TEMP/forge" make:resource LegacyIssue
          test -f internal/resources/legacyissue/authorization.go
          grep -q 'legacyissueAuthorize := legacyissueresource.AuthorizeFunc(legacyissueresource.Authorize)' routes/resources_gen.go
          grep -q 'NewController(legacyissueRepository, legacyissueAuthorize)' routes/resources_gen.go
          grep -q 'NewWebController(legacyissueRepository, renderer, legacyissueAuthorize)' routes/resources_gen.go
          "$RUNNER_TEMP/forge" make:resource TypedTicket \
            --field title:string \
            --field notes:text:nullable \
            --field priority:integer \
            --field estimate:integer:nullable \
            --field active:boolean \
            --field featured:boolean:nullable
          "$RUNNER_TEMP/forge" make:resource Category --field title:string
          "$RUNNER_TEMP/forge" make:resource Issue \
            --field summary:string \
            --belongs-to category:Category
          "$RUNNER_TEMP/forge" make:mail AuditNotice
          go mod verify
          go mod tidy -diff
          "$RUNNER_TEMP/forge" test
          go test -race ./...
          go vet ./...
          "$RUNNER_TEMP/forge" build
          go build ./cmd/worker
          go build ./cmd/scheduler
          test -x bin/app
          APP_ENV=local APP_URL=http://127.0.0.1:18082 APP_ADDRESS=127.0.0.1:18082 DATABASE_URL="$GOFORGE_TEST_DATABASE_URL" "$RUNNER_TEMP/forge" migrate
          APP_ENV=local APP_URL=http://127.0.0.1:18082 APP_ADDRESS=127.0.0.1:18082 DATABASE_URL="$GOFORGE_TEST_DATABASE_URL" JOB_POLL_INTERVAL=100ms SCHEDULE_POLL_INTERVAL=1s "$RUNNER_TEMP/forge" dev >"$RUNNER_TEMP/current-dev.log" 2>&1 &
          dev_pid=$!
          descendant_pids() {
            for child in $(pgrep -P "$1" 2>/dev/null || true); do
              descendant_pids "$child"
              echo "$child"
            done
          }
          stop_dev() {
            kill -TERM "$dev_pid" 2>/dev/null || true
            forced=0
            for attempt in $(seq 1 400); do
              state=$(awk '{print $3}' "/proc/$dev_pid/stat" 2>/dev/null || true)
              if [ -z "$state" ] || [ "$state" = Z ]; then break; fi
              sleep 0.1
            done
            state=$(awk '{print $3}' "/proc/$dev_pid/stat" 2>/dev/null || true)
            if [ -n "$state" ] && [ "$state" != Z ]; then
              forced=1
              descendants=$(descendant_pids "$dev_pid")
              if [ -n "$descendants" ]; then kill -KILL $descendants 2>/dev/null || true; fi
              kill -KILL "$dev_pid" 2>/dev/null || true
            fi
            if wait "$dev_pid"; then status=0; else status=$?; fi
            if [ "$forced" -ne 0 ]; then cat "$RUNNER_TEMP/current-dev.log"; return 124; fi
            return "$status"
          }
          cleanup() {
            stop_dev || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 300); do
            if grep -Fxq 'development services ready' "$RUNNER_TEMP/current-dev.log"; then break; fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then cat "$RUNNER_TEMP/current-dev.log"; exit 1; fi
            sleep 0.1
          done
          grep -q '^\[server\].*serving http://' "$RUNNER_TEMP/current-dev.log"
          grep -q '^\[worker\].*worker_started' "$RUNNER_TEMP/current-dev.log"
          grep -q '^\[scheduler\].*event=scheduler_started' "$RUNNER_TEMP/current-dev.log"
          test "$(grep -Fxc 'development services ready' "$RUNNER_TEMP/current-dev.log")" -eq 1
          curl --fail --silent --max-time 1 http://127.0.0.1:18082/health >/dev/null
          curl --fail --silent --max-time 2 -H 'Sec-Fetch-Dest: document' http://127.0.0.1:18082/ | grep -Eq 'data-goforge-generation="[0-9]+" defer></script>'
          stop_dev
          trap - EXIT
      - name: Generated PostgreSQL applications
        run: go test ./internal/cli -run '^(TestGeneratedPostgresWorkflow|TestGeneratedJobPostgresWorkflow|TestGeneratedDevelopmentServerWorkflow|TestGeneratedAccountRecoveryPostgresWorkflow|TestGeneratedBelongsToPostgresWorkflow|TestGeneratedSchedulePostgresWorkflow|TestGeneratedResourceAuthorizationPostgresWorkflow|TestGeneratedModelPostgresWorkflow)$' -count=2 -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Windows CLI tests
        run: go test ./asset ./cmd/forge ./internal/cli
      - name: Windows CLI vet
        run: go vet ./asset ./cmd/forge ./internal/cli
      - name: Windows CLI build
        run: go build -o "$env:RUNNER_TEMP\forge.exe" ./cmd/forge
